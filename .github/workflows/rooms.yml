name: Room snapshot
on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:
permissions:
  contents: write
concurrency: rooms
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/rooms.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add status/
          git diff --cached --quiet || git commit -m "rooms: $(date -u +'%Y-%m-%d %H:%M') snapshot" && git push

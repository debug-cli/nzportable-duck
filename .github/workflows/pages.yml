name: Deploy patcher page
on:
  push:
    branches: [main]
    paths: ["index.html", "patcher.js", "config/**", "status/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: pages
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p _site/config/nzp _site/status
          cp index.html patcher.js _site/
          cp config/default.fmf config/identity.pfx _site/config/
          cp config/nzp/autoexec.cfg _site/config/nzp/
          cp status/rooms.json _site/status/ 2>/dev/null || true
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
      - id: d
        uses: actions/deploy-pages@v4
